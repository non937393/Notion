
name: Notion

options:
  bundleIdPrefix: com.non937393

targets:
  Notion:
    type: application
    platform: iOS
    deploymentTarget: "16.0"

    sources:
      - path: Sources/Notion

    resources:
      - path: Resources/index.html
      - path: Assets.xcassets

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.non937393.notion
        PRODUCT_NAME: Notion
        INFOPLIST_KEY_CFBundleDisplayName: Notion
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
