
name: Build Notion IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "Sources/**"
      - "Resources/**"
      - "Assets.xcassets/**"
      - "project.yml"
      - ".github/workflows/build-ipa.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate


      - name: Check app icon configuration
        run: |
          echo "Checking asset catalog..."
          find . -name "AppIcon.png" -o -name "Contents.json"

          echo "Checking generated Xcode settings..."
          xcodebuild \
            -project Notion.xcodeproj \
            -scheme Notion \
            -showBuildSettings |
            grep -E "ASSETCATALOG_COMPILER_APPICON_NAME|PRODUCT_BUNDLE_IDENTIFIER"


      - name: Build iOS app
        run: |
          xcodebuild \
            -project Notion.xcodeproj \
            -scheme Notion \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build


      - name: Diagnose compiled app icon
        run: |
          set -e

          APP="build/DerivedData/Build/Products/Release-iphoneos/Notion.app"

          echo "Checking compiled asset catalog..."
          ls -lh "$APP/Assets.car"

          echo "Checking icon metadata..."
          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleIcons" \
            "$APP/Info.plist" || true

          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleIcons~ipad" \
            "$APP/Info.plist" || true

          echo "Checking asset compiler build logs..."
          echo "Look above for CompileAssetCatalog warnings or errors."


      - name: Package IPA
        run: |
          set -e

          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/Notion.app"

          test -d "$APP_PATH"

          mkdir -p build/ipa/Payload
          cp -R "$APP_PATH" build/ipa/Payload/Notion.app

          cd build/ipa
          zip -qry "$GITHUB_WORKSPACE/Notion.ipa" Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Notion-IPA
          path: Notion.ipa
          if-no-files-found: error
          retention-days: 14
