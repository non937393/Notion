
name: Build Notion IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "Sources/**"
      - "Resources/**"
      - "Assets.xcassets/**"
      - "project.yml"
      - ".github/workflows/build-ipa.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build iOS app
        run: |
          xcodebuild \
            -project Notion.xcodeproj \
            -scheme Notion \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          set -e

          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/Notion.app"

          test -d "$APP_PATH"

          mkdir -p build/ipa/Payload
          cp -R "$APP_PATH" build/ipa/Payload/Notion.app

          cd build/ipa
          zip -qry "$GITHUB_WORKSPACE/Notion.ipa" Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Notion-IPA
          path: Notion.ipa
          if-no-files-found: error
          retention-days: 14
