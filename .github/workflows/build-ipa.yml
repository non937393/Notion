
name: Build Notion IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "Sources/**"
      - "Resources/**"
      - "Assets.xcassets/**"
      - "project.yml"
      - ".github/workflows/build-ipa.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate


      - name: Check app icon configuration
        run: |
          echo "Checking asset catalog..."
          find . -name "AppIcon.png" -o -name "Contents.json"

          echo "Checking generated Xcode settings..."
          xcodebuild \
            -project Notion.xcodeproj \
            -scheme Notion \
            -showBuildSettings |
            grep -E "ASSETCATALOG_COMPILER_APPICON_NAME|PRODUCT_BUNDLE_IDENTIFIER"


      - name: Validate app icon PNG
        run: |
          sips -g format -g pixelWidth -g pixelHeight \
            Assets.xcassets/AppIcon.appiconset/AppIcon.png

          python3 - <<'PY'
          import struct
          import zlib

          path = "Assets.xcassets/AppIcon.appiconset/AppIcon.png"
          with open(path, "rb") as f:
              data = f.read()

          assert data[:8] == b"\x89PNG\r\n\x1a\n", "Not a valid PNG"
          width, height = struct.unpack(">II", data[16:24])
          assert (width, height) == (1024, 1024), (
              f"Expected 1024x1024, got {width}x{height}"
          )
          print("PNG header valid; dimensions:", width, "x", height)
          PY


      - name: Build iOS app
        run: |
          xcodebuild \
            -project Notion.xcodeproj \
            -scheme Notion \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build


      - name: Diagnose compiled app icon
        run: |
          set -e

          APP="build/DerivedData/Build/Products/Release-iphoneos/Notion.app"

          echo "Checking compiled asset catalog..."
          ls -lh "$APP/Assets.car"

          echo "Checking icon metadata..."
          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleIcons" \
            "$APP/Info.plist" || true

          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleIcons~ipad" \
            "$APP/Info.plist" || true

          echo "Checking asset compiler build logs..."
          echo "Look above for CompileAssetCatalog warnings or errors."


      
      - name: Check compiled app icon
        run: |
          set -e

          APP="build/DerivedData/Build/Products/Release-iphoneos/Notion.app"

          test -f "$APP/Assets.car"
          test -f "$APP/Info.plist"

          xcrun --sdk iphoneos assetutil --info "$APP/Assets.car" \
            > /tmp/assets.json

          python3 - <<'PY'
          import json

          with open("/tmp/assets.json") as f:
              assets = json.load(f)

          icons = [
              item for item in assets
              if item.get("Name") == "AppIcon"
          ]

          print("Compiled AppIcon entries:", len(icons))
          for icon in icons:
              print({
                  "Name": icon.get("Name"),
                  "PixelWidth": icon.get("PixelWidth"),
                  "PixelHeight": icon.get("PixelHeight"),
                  "AssetType": icon.get("AssetType")
              })

          if not icons:
              raise SystemExit("AppIcon was not found in Assets.car")
          PY

      - name: Package IPA
        run: |
          set -e

          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/Notion.app"

          test -d "$APP_PATH"

          mkdir -p build/ipa/Payload
          cp -R "$APP_PATH" build/ipa/Payload/Notion.app

          cd build/ipa
          zip -qry "$GITHUB_WORKSPACE/Notion.ipa" Payload


      - name: Check packaged app icon
        run: |
          set -e

          mkdir -p /tmp/ipa-check
          unzip -q Notion.ipa -d /tmp/ipa-check

          APP="/tmp/ipa-check/Payload/Notion.app"

          echo "Bundle ID:"
          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleIdentifier" \
            "$APP/Info.plist"

          echo "Icon name:"
          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconName" \
            "$APP/Info.plist"

          echo "Packaged asset catalog:"
          ls -lh "$APP/Assets.car"


      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Notion-IPA
          path: Notion.ipa
          if-no-files-found: error
          retention-days: 14
